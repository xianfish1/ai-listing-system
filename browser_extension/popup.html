<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AI Listing 采集器</title>
<style>
  body { margin: 0; padding: 14px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; width: 300px; font-size: 13px; color: #222; }
  h1 { margin: 0 0 10px; font-size: 14px; }
  label { display: block; margin: 8px 0 4px; color: #555; font-size: 12px; }
  input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 8px; border: none; border-radius: 4px; background: #ff8a00; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #eee; color: #333; }
  #status { margin-top: 10px; color: #666; font-size: 12px; min-height: 16px; }
  #session { margin-top: 10px; padding: 8px; background: #f6f6f6; border-radius: 4px; font-size: 12px; color: #444; word-break: break-all; }
  #session:empty { display: none; }
</style>
</head>
<body>
  <h1>AI Listing 采集器</h1>
  <div id="session"></div>
  <label>Run ID</label>
  <input id="run-id" placeholder="从 Web UI 复制" />
  <label>API 地址</label>
  <input id="api" placeholder="http://10.144.0.3:8787" />
  <div class="row">
    <button id="save-btn">激活采集会话</button>
    <button id="clear-btn" class="secondary">清除</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
